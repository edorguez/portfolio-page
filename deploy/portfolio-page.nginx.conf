server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite output: hashed assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Keep the entry document fresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Static SPA fallback. There are no client-side routes today, but this
    # keeps the behaviour correct if routes are added later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
